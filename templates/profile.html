<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Profile · IVR Studio</title><link rel="stylesheet" href="/static/style.css?v=9"></head><body class="with-sidebar">{% include "sidebar.html" %}<main class="shell"><header><div><span class="eyebrow">ACCOUNT</span><h1>{{ username }}</h1><p>Your security settings and sign-in activity.</p></div></header><section class="profile-grid"><article class="card profile-card"><h2>Change password</h2><form id="passwordForm"><label>Current password<input id="current" type="password" required></label><label>New password<input id="next" type="password" minlength="8" required></label><button class="primary">Update password</button></form><p id="result"></p></article><article class="card"><h2>Login & logout history</h2><div id="profileActivity"></div></article></section></main><script>passwordForm.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/profile/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current.value,new_password:next.value})}),d=await r.json();result.textContent=r.ok?'Password updated successfully.':d.error;if(r.ok)e.target.reset()};fetch('/api/profile/activity').then(r=>r.json()).then(d=>profileActivity.innerHTML=d.events.map(x=>`<div class="activity-row"><b>${x.event_type==='login'?'Signed in':'Signed out'}</b><span></span><small>${new Date(x.created).toLocaleString()}</small></div>`).join('')||'<p>No sign-in activity recorded yet.</p>')</script></body></html>
